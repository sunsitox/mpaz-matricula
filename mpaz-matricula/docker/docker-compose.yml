# Entrega final · Portal de Matrícula MPAZ
# Uso:  cp .env.example .env  &&  docker compose up -d --build
# El puerto se publica solo en loopback; la exposición pública va por Cloudflare.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mpaz_matricula
      POSTGRES_USER: postgres
      # Sin valor por defecto: el compose se detiene si falta .env.
      POSTGRES_PASSWORD: ${CLAVE_POSTGRES:?Defina CLAVE_POSTGRES en .env}
      # El rol de la aplicación lo crea db-init/00-rol-app.sh con esta clave, para
      # que no quede escrita en un .sql del repositorio.
      CLAVE_APP: ${CLAVE_APP:?Defina CLAVE_APP en .env}
      TZ: America/Santiago
    volumes:
      - datos-db:/var/lib/postgresql/data
      # Solo se ejecutan cuando el volumen está vacío (primer arranque).
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mpaz_matricula"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [mpaz]

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Obligatorio: el dominio público del portal (S-08). Producción no arranca
      # con AllowedHosts comodín.
      AllowedHosts: "${ALLOWED_HOSTS:?Defina ALLOWED_HOSTS en .env con el dominio del portal}"
      DataProtection__KeysPath: /keys
      Seguridad__ExigirInicioSesion: "true"
      # Sólo si hay funcionarios sin cuenta Identity y se entrega una clave
      # temporal; se retira después del primer arranque.
      Seguridad__ContrasenaInicial: ${CLAVE_INICIAL:-}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=mpaz_matricula;Username=mpaz_app;Password=${CLAVE_APP:?Defina CLAVE_APP en .env};SSL Mode=Disable;Search Path=mpaz_matricula,public"
      # Expediente documental en un volumen propio: sobrevive a los rebuild.
      Documentos__RutaBase: /datos/documentos
      # MAT-05 sigue bloqueado hasta aprobar el protocolo TENS.
      Medicacion__Habilitada: "false"
    volumes:
      - claves:/keys
      - documentos:/datos/documentos
    ports:
      - "127.0.0.1:${PUERTO_APP:-5101}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [mpaz]

volumes:
  datos-db:
  claves:
  documentos:

networks:
  mpaz:
